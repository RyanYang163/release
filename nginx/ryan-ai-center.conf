# Nginx route for AI Center — WebUI External Open (new browser tab).
#
# Required by the development guide section 8.3.2 / 8.11:
#   - filename must be <app_id>.conf, matching config.ini id
#   - permissions 0644
#   - must contain ONLY a location block, never a server block
#   - the platform nginx includes this directory in alphabetical order, so the
#     listen port must be unique across installed applications
#
# config.ini "path" is /ryan-ai-center/, so the platform opens
# http://<nas-ip>/ryan-ai-center/ in a new tab and nginx proxies it to the
# backend's port.
location /ryan-ai-center/ {
    proxy_pass http://127.0.0.1:18788/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
